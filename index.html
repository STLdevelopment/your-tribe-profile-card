<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FDND Visitekaartje</title>
    <link rel="stylesheet" href="styles/style.css">
</head>
<body>
    <section>
        <div class="kaartje-wrapper">
            <div class="top-bar">
                <img src="Assets/Home_icon.svg">
                <ul>
                    <li>Webdesign</li>
                    <li>Webdevelopment</li>
                    <li>Data Inzage</li>
                </ul>
            </div>
            <div class="main-section">
                <div class="main-left">
                    <div class="hero-container">
                        <div class="icon-box">
                            <img src="Assets/Logo_placeholder.svg">
                            <h1>Jouw merk op de voorgrond</h1>
                        </div>
                    </div>
                    <p>Iedereen die (online) gevonden wilt kunnen worden heeft een website nodig.</p>
                </div>
                <div class="main-right">
                    <img class="profile_picture">
                    <p>S.T. Leung</p>
                </div>
            </div>
            <div class="footer-bar">
                <div class="email">
                    <div class="icon-box">
                        <img src="Assets/Mail_icon.svg">
                        <p>sun.leung@hva.nl</p>
                    </div>
                </div>
                <div class="phone">
                    <div class="icon-box">
                        <img src="Assets/Phone_icon.svg">
                        <p>06 1234 5678</p>
                    </div>
                </div>
            </div>
        </div>
    </section>
</body>
</html>
